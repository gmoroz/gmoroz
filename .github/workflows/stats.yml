name: Render profile statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/render_stats.py
      - name: Commit changed cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update GitHub profile statistics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
